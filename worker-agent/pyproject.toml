[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "trans-jules-node"
version = "0.1.0"
description = "Distributed inference worker agent for Trans Jules"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "psutil>=6,<8"]
[project.scripts]
trans-jules-node = "trans_jules_node.cli:app"
[tool.setuptools.packages.find]
where = ["."]
include = ["trans_jules_node*"]
